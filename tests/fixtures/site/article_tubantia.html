<body><main><h1>Tilburgse weverij Voorbeeld weeft met gerecycled garen voor interieurmerk</h1>
<p><time>3 november 2025</time></p>
<p>Voorbeeld Weverij levert vanaf dit najaar gordijnstof van gerecycled polyester aan een
Nederlands interieurmerk. Directeur Anna de Vries: "We zoeken nog een partij die ons
snijafval kan sorteren."</p>
