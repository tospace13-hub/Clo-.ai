[project]
name = "clo"
version = "0.1.0"
description = "Clo — network orchestrator for the TOS13 network period"
readme = "README.md"
authors = [
    { name = "TOS13", email = "hello@space13.to" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12.1",
    "beautifulsoup4>=4.15.0",
    "pydantic>=2.14.0",
]

[project.optional-dependencies]
tell = [
    "openpyxl>=3.1.5",
    "pymysql>=1.2.3",
]
pdf = [
    "pypdf>=6.19.0",
]

[project.scripts]
clo = "clo.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
